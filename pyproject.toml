[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[project]
name = "rag-ingestion-pipeline"
version = "0.1.0"
description = "Document ingestion, PII redaction, chunking, embeddings and evaluated retrieval for RAG"
readme = "README.md"
requires-python = ">=3.10"
license = {text = "MIT"}
dependencies = ["numpy>=1.24"]

[project.optional-dependencies]
bedrock = ["boto3>=1.34"]
dev = ["pytest>=7", "ruff>=0.4"]

[project.scripts]
rag = "rag_pipeline.cli:main"

[tool.setuptools.packages.find]
where = ["src"]

[tool.pytest.ini_options]
testpaths = ["tests"]

[tool.ruff]
line-length = 115

[tool.ruff.lint]
select = ["E", "F"]
